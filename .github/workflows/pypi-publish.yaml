name: Publish to PyPI

# Publishing only happens when a GitHub Release is published (or when the
# workflow is run by hand against a *tag*, TestPyPI only).
#
# The version comes from the git tag via versioningit, e.g. tag "0.1.0".
# One-time setup (Trusted Publishing, no API tokens needed):
#   PyPI:     https://pypi.org/manage/account/publishing/
#   TestPyPI: https://test.pypi.org/manage/account/publishing/
#     project: pyfresean   owner: HeydenLabASU-collab   repo: pyFRESEAN
#     workflow: pypi-publish.yaml   environment: pypi  (resp. testpypi)
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    if: github.repository_owner == 'HeydenLabASU-collab'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # versioningit needs full history and tags to compute the version
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build sdist and wheel
      run: |
        python -m pip install build twine
        python -m build

    - name: Check metadata
      run: twine check --strict dist/*

    - name: Refuse non-release versions
      # PyPI rejects local versions ("0.1.0+3.gabc123"); this happens when the
      # build is not on an exact tag.
      run: |
        ls dist
        if ls dist | grep -q '+'; then
          echo "::error::Version contains '+': build from an exact release tag."
          exit 1
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyfresean
    permissions:
      id-token: write  # required for Trusted Publishing

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Upload to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    # Real PyPI only on a published release, and only after TestPyPI worked.
    if: github.event_name == 'release'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyfresean
    permissions:
      id-token: write  # required for Trusted Publishing

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
