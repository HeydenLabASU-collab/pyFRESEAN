name: GH Actions CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly tests at midnight on Sundays run on main by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 0 * * 0"

concurrency:
  # Specific group naming so CI is only cancelled
  # within same PR or on merge to main
  group: ${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  -l {0}

jobs:
  main-tests:
    if: github.repository_owner == 'HeydenLabASU-collab'
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, macOS-latest, windows-latest]
          mdanalysis-version: ["latest", "develop"]
          python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Build information
      run: |
        uname -a
        df -h
        ulimit -a


    # More info on options: https://github.com/conda-incubator/setup-miniconda
    - name: Install conda dependencies
      uses: conda-incubator/setup-miniconda@v4
      with:
        python-version: ${{ matrix.python-version }}
        environment-file: devtools/conda-envs/test_env.yaml
        add-pip-as-python-dependency: true

        miniforge-version: "latest"
        use-mamba: true
        channels: conda-forge

        activate-environment: pyfresean-test
        auto-update-conda: true
        auto-activate-base: false
        show-channel-urls: true


    - name: Install MDAnalysis version
      uses: MDAnalysis/install-mdanalysis@main
      with:
        version: ${{ matrix.mdanalysis-version }}
        install-tests: false
        installer:  mamba
        shell: bash  -l {0}

    - name: Install package
      run: |
        python --version
        python -m pip install . --no-deps

    - name: Python information
      run: |
        which python
        which pip
        pip list

        conda info
        conda list


    - name: Run unit tests
      run: |
        pytest -n 2 -v --cov=pyfresean --cov-report=xml --color=yes pyfresean/tests/

    - name: Upload coverage to Codecov
      if: >-
        github.event_name != 'schedule'
        && matrix.os == 'ubuntu-latest'
        && matrix.python-version == '3.12'
        && matrix.mdanalysis-version == 'latest'
      uses: codecov/codecov-action@v5
      with:
        file: coverage.xml
        name: codecov-unit-ubuntu-py3.12
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}
        # Set true after CODECOV_TOKEN is added (org Codecov app + repo secret).
        fail_ci_if_error: false


  reference-regression-tests:
    if: github.repository_owner == 'HeydenLabASU-collab'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - uses: conda-incubator/setup-miniconda@v4
      with:
        python-version: "3.12"
        environment-file: devtools/conda-envs/test_env.yaml
        add-pip-as-python-dependency: true
        miniforge-version: "latest"
        use-mamba: true
        channels: conda-forge
        activate-environment: pyfresean-test
        auto-update-conda: true
        auto-activate-base: false

    - uses: MDAnalysis/install-mdanalysis@main
      with:
        version: latest
        install-tests: false
        installer: mamba
        shell: bash -l {0}

    - name: Install package and matplotlib (c_ref plots)
      run: |
        python -m pip install . --no-deps
        python -m pip install matplotlib

    - name: Prepare plot output directories
      run: |
        mkdir -p ci-artifacts/c-ref-plots/ala_dipeptide_gas_300K
        mkdir -p ci-artifacts/c-ref-plots/hewl_solution_303K

    - name: Run pytutorial_ref regression (Python tutorial reference)
      run: |
        pytest -m pytutorial_ref -v --tb=short \
          pyfresean/tests/test_fresean_regression_ala_dipeptide_gas_50K_pytutorial_ref.py

    - name: Run c_ref regression — alanine dipeptide (gas, 300 K)
      run: |
        pytest -m c_ref -v --tb=short --c-ref-plot \
          --c-ref-plot-dir ci-artifacts/c-ref-plots/ala_dipeptide_gas_300K \
          pyfresean/tests/test_fresean_regression_ala_dipeptide_gas_300K_c_ref.py

    - name: Run c_ref regression — HEWL (solution, 303 K)
      run: |
        pytest -m c_ref -v --tb=short --c-ref-plot \
          --c-ref-plot-dir ci-artifacts/c-ref-plots/hewl_solution_303K \
          pyfresean/tests/test_fresean_regression_hewl_solution_303K_c_ref.py

    - name: Upload c_ref comparison plots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: c-ref-plots-${{ github.workflow }}-${{ github.run_id }}
        path: ci-artifacts/c-ref-plots/
        if-no-files-found: warn
        retention-days: 30


  pylint_check:
    if: github.repository_owner == 'HeydenLabASU-collab'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Pylint
      run: |
        which pip
        which python
        pip install pylint mdanalysis

    - name: Run Pylint
      env:
        PYLINTRC: .pylintrc
      run: |
        pylint .


  pypi_check:
    if: github.repository_owner == 'HeydenLabASU-collab'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install pipx twine

    - name: Build package
      run: |
        python -m pipx run build --sdist

    - name: Check package build
      run: |
        DISTRIBUTION=$(ls -t1 dist/pyfresean-*.tar.gz | head -n 1)
        test -n "${DISTRIBUTION}" || { echo "no distribution dist/pyfresean-*.tar.gz found"; exit 1; }
        echo "twine check $DISTRIBUTION"
        twine check $DISTRIBUTION
